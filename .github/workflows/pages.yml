# Собирает вики из папки articles/ и публикует сайт на GitHub Pages при каждой правке.
name: Публикация вики
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write       # чтобы сохранить статьи, созданные из таблиц Excel
  pages: write
  id-token: write
# Several saves in a row: only the newest run continues, older ones are cancelled (grey, not an error).
# Each run always builds the newest version of main, so nothing is lost when a run is cancelled,
# and re-running an old run never brings back an old version of the site.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # always the newest version, even when re-running an old run
          fetch-depth: 0          # нужна история, чтобы показывать даты правок
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Tables in excel/ that changed since the last import → articles. The result is saved to the repository,
      # so the editor shows the imported fields. A push made here does not start another run.
      - name: Импорт из Excel
        run: |
          node tools/import-excel.mjs
          git add articles excel
          if ! git diff --cached --quiet; then
            git -c user.name="Импорт из Excel" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Импорт из Excel"
            for i in 1 2 3; do
              if git pull -q --rebase origin main; then git push -q origin HEAD:main && break; else git rebase --abort; fi
              sleep 3
            done
          fi
      # Fresh table with all wiki data for admins to download: …/tables/wiki-kanyalo.xlsx
      - name: Таблица Excel для скачивания
        run: node tools/export-excel.mjs
      - run: node tools/build-wiki.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
